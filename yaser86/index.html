<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0c10" />
    <meta
      name="description"
      content="هنا بنحط الوصف"
    />
    <meta name="author" content="Yaser86 Community" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yaser86 Community" />
    <meta property="og:title" content="Yaser86 Community" />
    <meta
      property="og:description"
      content="هنا بنحط الوصف"
    />
    <meta property="og:image" content="/icon.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Yaser86 Community" />
    <meta
      name="twitter:description"
      content="هنا بنحط الوصف"
    />
    <meta name="twitter:image" content="/icon.png" />

    <title>Yaser86 Community</title>
    <link rel="icon" type="image/png" href="icon.png" />

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap');

      :root {
        color-scheme: dark;
        --bg: #0a0c10;
        --surface: #11151c;
        --surface-2: #181e26;
        --border: #252d38;
        --text: #f0f0ff;
        --text-dim: #8b95a7;
        --highlight: #00e5a0;
        --highlight-2: #00b8ff;
        --discord: #5865f2;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        background: var(--bg);
        background-image:
          radial-gradient(circle at 50% 0%, rgba(88, 101, 242, 0.08) 0%, transparent 60%),
          radial-gradient(circle at 80% 100%, rgba(0, 184, 255, 0.05) 0%, transparent 40%),
          linear-gradient(180deg, #0a0c10 0%, #0d1117 100%);
        color: var(--text);
        font-family: 'Inter', 'Cairo', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        position: relative;
        overflow-x: hidden;
        line-height: 1.6;
        direction: ltr;
      }

      .container {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 520px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0;
        transform: translateY(20px);
      }

      @keyframes fadeUp {
        to { opacity: 1; transform: translateY(0); }
      }

      .profile-wrapper {
        position: relative;
        cursor: pointer;
        transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        outline: none;
        border: none;
        background: none;
        padding: 0;
        width: 140px;
        height: 140px;
        border-radius: 50%;
      }

      .profile-wrapper:hover,
      .profile-wrapper:focus-visible {
        transform: scale(1.05);
      }

      .profile-wrapper:active {
        transform: scale(0.97);
      }

      .profile-img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid var(--border);
        background: var(--surface);
        display: block;
        transition: border-color 0.3s ease;
      }

      .profile-wrapper:hover .profile-img {
        border-color: var(--highlight);
      }

      .name-section {
        text-align: center;
      }

      .name-en {
        font-size: clamp(1.5rem, 5vw, 2.2rem);
        font-weight: 800;
        letter-spacing: 0.01em;
        background: linear-gradient(135deg, #ffffff 0%, #c8d6e5 50%, #a0b4c8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        word-break: break-word;
      }

      .bio {
        color: var(--text-dim);
        font-size: 1rem;
        text-align: center;
        max-width: 360px;
        margin-top: -8px;
        direction: rtl;
        font-family: 'Cairo', sans-serif;
      }

      .socials {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 8px;
      }

      .social-link {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 24px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        text-decoration: none;
        font-weight: 600;
        font-size: 1.05rem;
        transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        position: relative;
        overflow: hidden;
      }

      .social-link::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(0, 229, 160, 0.05), rgba(0, 184, 255, 0.05));
        opacity: 0;
        transition: opacity 0.3s;
      }

      .social-link:hover {
        transform: translateY(-3px);
        border-color: var(--discord);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3), 0 0 20px rgba(88, 101, 242, 0.2);
      }

      .social-link:hover::after {
        opacity: 1;
      }

      .social-link svg {
        width: 24px;
        height: 24px;
        fill: currentColor;
        flex-shrink: 0;
      }

      .social-link span {
        position: relative;
        z-index: 1;
      }

      @media (max-width: 480px) {
        .profile-wrapper {
          width: 110px;
          height: 110px;
        }
        .social-link {
          padding: 12px 20px;
          font-size: 0.9rem;
          gap: 8px;
        }
        .social-link svg {
          width: 20px;
          height: 20px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .container {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>

  <body>
    <main class="container">
      <button
        class="profile-wrapper"
        type="button"
        aria-label="Yaser86 Community profile picture"
        title="Yaser86 Community"
      >
        <img
          class="profile-img"
          src="/icon.png"
          alt="Yaser86 Community"
          onerror="this.style.display='none'"
        />
      </button>

      <div class="name-section">
        <h1 class="name-en">Yaser86 Community</h1>
      </div>

      <div class="bio">
        هنا بنحط الوصف
      </div>

      <nav class="socials" aria-label="social links">
        <a
          class="social-link discord"
          href="https://discord.gg/RKjPFpkzP"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="انضمام إلى سيرفر Discord"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.3 4.4c-1.6-.7-3.2-1.2-4.9-1.5-.2.4-.4.8-.6 1.2-1.8-.3-3.6-.3-5.4 0-.2-.4-.4-.8-.6-1.2-1.7.3-3.3.8-4.9 1.5C1.2 9.6.5 14.7.9 19.7c1.8 1.3 3.6 2.1 5.4 2.7.4-.6.8-1.2 1.1-1.9-.6-.2-1.2-.5-1.7-.8l.4-.3c3.6 1.7 7.5 1.7 11.1 0l.4.3c-.5.3-1.1.6-1.7.8.3.7.7 1.3 1.1 1.9 1.8-.6 3.6-1.4 5.4-2.7.5-5.7-.9-10.7-3.9-15.3ZM8.5 16.6c-1.1 0-2-1-2-2.2s.9-2.2 2-2.2 2 1 2 2.2-.9 2.2-2 2.2Zm7 0c-1.1 0-2-1-2-2.2s.9-2.2 2-2.2 2 1 2 2.2-.9 2.2-2 2.2Z" />
          </svg>
          <span>انضمام</span>
        </a>
      </nav>
    </main>
  </body>
</html>
