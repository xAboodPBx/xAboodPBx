    <style>
      :root {
        color-scheme: dark;
        --background: #0f0f0f;
        --text: #f0f0ff;
        --highlight: #00e5a0;
        --good: #3dbf6a;
        --bad: #e04444;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        background: var(--background);
        color: var(--text);
        font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
        overflow-x: hidden;
      }

      .site-header {
        position: absolute;
        z-index: 2;
        top: 0;
        right: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px clamp(24px, 5vw, 64px);
      }

      .site-title {
        display: flex;
        align-items: baseline;
        gap: 0.55em;
        margin: 0;
        font-size: clamp(1.25rem, 2vw, 1.5rem);
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .site-title-divider {
        color: var(--highlight);
        font-weight: 400;
      }

      .site-title [lang="ar"] {
        letter-spacing: 0;
        direction: rtl;
      }

      main {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-content: center;
        justify-items: center;
        padding: 48px 16px 144px;
      }

      .logo-trigger {
        appearance: none;
        position: relative;
        display: block;
        border: 0;
        padding: 0;
        background: none;
        cursor: pointer;
        transition: transform 300ms cubic-bezier(0.22, 1, 0.36, 1);
        outline: none;
      }

      .logo {
        display: block;
        width: min(clamp(260px, 38vw, 380px), calc(100vw - 32px));
        height: auto;
        filter: drop-shadow(0 0 30px rgba(0, 229, 160, 0.15));
      }

      .logo-letter {
        font-size: clamp(6rem, 18vw, 10rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
        color: var(--text);
        background: linear-gradient(135deg, #ffffff 0%, #c8d6e5 50%, #a0b4c8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-align: center;
        user-select: none;
      }

      .logo-trigger:hover,
      .logo-trigger:focus-visible {
        transform: scale(1.06);
      }

      .logo-trigger:focus-visible {
        outline: 2px solid var(--highlight);
        outline-offset: 12px;
        border-radius: 50%;
      }

      .logo-trigger:active {
        transform: scale(0.98);
      }

      .intro {
        margin-top: 28px;
        text-align: center;
      }

      .intro-description {
        margin-top: 0;
        color: var(--highlight);
        font-size: clamp(1rem, 2vw, 1.125rem);
        line-height: 1.5;
      }

      .intro-description p {
        margin: 0;
      }

      .socials {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: clamp(6px, 1.5vw, 18px);
        margin-top: 42px;
      }

      .social-link {
        display: grid;
        width: 66px;
        height: 66px;
        place-items: center;
        color: var(--text);
        text-decoration: none;
        transition: color 0.3s ease, transform 0.3s ease;
      }

      .social-link:hover {
        color: var(--highlight);
        transform: translateY(-4px);
      }

      .social-link:focus-visible {
        color: var(--highlight);
        outline: none;
      }

      .social-link svg {
        width: 31.5px;
        height: 31.5px;
        fill: currentColor;
      }

      footer {
        position: fixed;
        z-index: 1;
        right: 0;
        bottom: max(36px, env(safe-area-inset-bottom));
        left: 0;
        padding: 0 36px;
        text-align: center;
        font-size: 1.1rem;
      }

      .business-email {
        color: var(--text);
        text-underline-offset: 6px;
      }

      .business-email:hover {
        color: var(--highlight);
        text-decoration-thickness: 3px;
      }

      .splash-canvas {
        position: fixed;
        z-index: 0;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .logo-trigger {
          transition: none;
        }
      }

      @media (max-width: 720px) {
        .site-header {
          padding: 22px 20px;
        }

        main {
          padding-top: 88px;
          padding-bottom: 40px;
        }

        .logo {
          width: min(260px, calc(100vw - 48px));
        }

        .intro {
          margin-top: 20px;
        }

        .socials {
          width: min(300px, 100%);
          margin-top: 28px;
        }

        footer {
          position: static;
          padding: 20px 24px 32px;
        }
      }

    <canvas class="splash-canvas" aria-hidden="true"></canvas>

    <script>
      const splashTrigger = document.querySelector('.logo-trigger');
      const logoWaveCanvas = document.querySelector('.logo-wave-canvas');
      const logoWaveContext = logoWaveCanvas.getContext('2d');
      const splashCanvas = document.querySelector('.splash-canvas');
      const splashContext = splashCanvas.getContext('2d');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

      let logoWaveWidth = 0;
      let logoWaveHeight = 0;
      let animationFrame = 0;
      let previousTime = 0;

      const logoMaskCanvas = document.createElement('canvas');
      const logoMaskContext = logoMaskCanvas.getContext('2d', { willReadFrequently: true });
      const logoMaskSize = 256;
      let logoMaskPixels = null;
      const particles = [];
      const logoWaves = [];
      const burstCount = 12;
      const waveExpansionTime = 160;
      const waveFadeTime = 90;

      logoMaskCanvas.width = logoMaskSize;
      logoMaskCanvas.height = logoMaskSize;

      function prepareLogoMask() {
        logoMaskContext.clearRect(0, 0, logoMaskSize, logoMaskSize);
        logoMaskContext.fillStyle = '#000';
        logoMaskContext.fillRect(0, 0, logoMaskSize, logoMaskSize);
        logoMaskContext.fillStyle = '#fff';
        logoMaskContext.font = 'bold 200px Arial, sans-serif';
        logoMaskContext.textAlign = 'center';
        logoMaskContext.textBaseline = 'middle';
        logoMaskContext.fillText('A', logoMaskSize / 2, logoMaskSize / 2 + 10);
        try {
          logoMaskPixels = logoMaskContext.getImageData(0, 0, logoMaskSize, logoMaskSize).data;
        } catch {
          logoMaskPixels = null;
        }
      }

      function resizeSplashCanvas() {
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        splashCanvas.width = Math.round(window.innerWidth * pixelRatio);
        splashCanvas.height = Math.round(window.innerHeight * pixelRatio);
        splashContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      }

      function resizeLogoWaveCanvas() {
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        logoWaveWidth = logoWaveCanvas.clientWidth;
        logoWaveHeight = logoWaveCanvas.clientHeight;
        logoWaveCanvas.width = Math.round(logoWaveWidth * pixelRatio);
        logoWaveCanvas.height = Math.round(logoWaveHeight * pixelRatio);
        logoWaveContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      }

      function findLogoEdge(angle, bounds, maskOrigin) {
        const directionX = Math.cos(angle);
        const directionY = Math.sin(angle);
        let lastVisiblePoint = null;

        if (logoMaskPixels) {
          const maximumDistance = Math.ceil(Math.SQRT2 * logoMaskSize);
          for (let distance = 0; distance <= maximumDistance; distance += 1) {
            const maskX = Math.round(maskOrigin.x + directionX * distance);
            const maskY = Math.round(maskOrigin.y + directionY * distance);
            if (maskX < 0 || maskX >= logoMaskSize || maskY < 0 || maskY >= logoMaskSize) break;
            const alphaIndex = (maskY * logoMaskSize + maskX) * 4 + 3;
            if (logoMaskPixels[alphaIndex] > 24) {
              lastVisiblePoint = { maskX, maskY, distance };
            }
          }
        }

        if (lastVisiblePoint) {
          return {
            x: bounds.left + (lastVisiblePoint.maskX / logoMaskSize) * bounds.width,
            y: bounds.top + (lastVisiblePoint.maskY / logoMaskSize) * bounds.height,
            distance: (lastVisiblePoint.distance / logoMaskSize) * bounds.width,
            angle
          };
        }

        const horizontalLimit = directionX > 0 ? (logoMaskSize - 1 - maskOrigin.x) / directionX : (0 - maskOrigin.x) / directionX;
        const verticalLimit = directionY > 0 ? (logoMaskSize - 1 - maskOrigin.y) / directionY : (0 - maskOrigin.y) / directionY;
        const fallbackMaskDistance = Math.min(
          ...[horizontalLimit, verticalLimit].filter(d => Number.isFinite(d) && d > 0)
        ) * 0.9;
        const fallbackMaskX = maskOrigin.x + directionX * fallbackMaskDistance;
        const fallbackMaskY = maskOrigin.y + directionY * fallbackMaskDistance;
        const fallbackDistance = (fallbackMaskDistance / logoMaskSize) * bounds.width;

        return {
          x: bounds.left + (fallbackMaskX / logoMaskSize) * bounds.width,
          y: bounds.top + (fallbackMaskY / logoMaskSize) * bounds.height,
          distance: fallbackDistance,
          angle
        };
      }

      function addLogoShockwave(origin, maximumRadius, highlightColor) {
        logoWaves.push({
          x: origin.x,
          y: origin.y,
          age: 0,
          travelTime: waveExpansionTime / 1000,
          fadeTime: waveFadeTime / 1000,
          maximumRadius,
          thickness: Math.max(20, logoWaveWidth * 0.065),
          color: highlightColor
        });
        if (!animationFrame) {
          previousTime = performance.now();
          animationFrame = requestAnimationFrame(animateSplash);
        }
      }

      function addBurstParticle(edge, index, highlightColor) {
        const angle = edge.angle + (Math.random() - 0.5) * 0.16;
        const speed = 150 + Math.random() * 130;
        const lifetime = 1.05 + Math.random() * 0.45;
        particles.push({
          x: edge.x + Math.cos(angle) * 3,
          y: edge.y + Math.sin(angle) * 3,
          velocityX: Math.cos(angle) * speed,
          velocityY: Math.sin(angle) * speed,
          drag: 0.972 + Math.random() * 0.016,
          gravity: 20 + Math.random() * 35,
          width: 4.5 + Math.random() * 4.5,
          length: 30 + Math.random() * 44,
          age: 0,
          lifetime,
          color: highlightColor,
          dot: index % 5 === 0
        });
        if (!animationFrame) {
          previousTime = performance.now();
          animationFrame = requestAnimationFrame(animateSplash);
        }
      }

      function createSplash(event) {
        if (reducedMotion.matches) return;
        const highlightColor = getComputedStyle(document.documentElement)
          .getPropertyValue('--highlight')
          .trim();
        const bounds = logoWaveCanvas.getBoundingClientRect();
        const pressedWithPointer = event.detail > 0;
        const pointerX = pressedWithPointer ? event.clientX : bounds.left + bounds.width / 2;
        const pointerY = pressedWithPointer ? event.clientY : bounds.top + bounds.height / 2;
        const normalizedX = Math.min(1, Math.max(0, (pointerX - bounds.left) / bounds.width));
        const normalizedY = Math.min(1, Math.max(0, (pointerY - bounds.top) / bounds.height));
        const maskOrigin = { x: normalizedX * logoMaskSize, y: normalizedY * logoMaskSize };
        const waveOrigin = { x: normalizedX * logoWaveWidth, y: normalizedY * logoWaveHeight };
        const edges = [];

        for (let index = 0; index < burstCount; index += 1) {
          const angle = -Math.PI / 2 + (Math.PI * 2 * index) / burstCount + (Math.random() - 0.5) * 0.12;
          edges.push(findLogoEdge(angle, bounds, maskOrigin));
        }

        const farthestEdge = Math.max(...edges.map(edge => edge.distance));
        const viewportToLogoScale = logoWaveWidth / bounds.width;
        addLogoShockwave(waveOrigin, farthestEdge * viewportToLogoScale * 1.08, highlightColor);

        edges.forEach((edge, index) => {
          const delay = Math.round(5 + (edge.distance / farthestEdge) * waveExpansionTime * 0.95);
          setTimeout(() => {
            addBurstParticle(edge, index, highlightColor);
          }, delay);
        });
      }

      function drawLogoShockwaves(deltaTime) {
        logoWaveContext.clearRect(0, 0, logoWaveWidth, logoWaveHeight);
        logoWaveContext.lineCap = 'round';
        for (let index = logoWaves.length - 1; index >= 0; index -= 1) {
          const wave = logoWaves[index];
          const totalLifetime = wave.travelTime + wave.fadeTime;
          wave.age += deltaTime;
          if (wave.age >= totalLifetime) {
            logoWaves.splice(index, 1);
            continue;
          }
          const travelProgress = Math.min(wave.age / wave.travelTime, 1);
          const fadeProgress = Math.max(0, (wave.age - wave.travelTime) / wave.fadeTime);
          const radius = wave.thickness + (wave.maximumRadius - wave.thickness) * travelProgress;
          logoWaveContext.globalAlpha = 1 - fadeProgress;
          logoWaveContext.strokeStyle = wave.color;
          logoWaveContext.lineWidth = wave.thickness;
          logoWaveContext.beginPath();
          logoWaveContext.arc(wave.x, wave.y, radius, 0, Math.PI * 2);
          logoWaveContext.stroke();
        }
        logoWaveContext.globalAlpha = 1;
        if (!logoWaves.length) return;
        logoWaveContext.globalCompositeOperation = 'destination-in';
        logoWaveContext.fillStyle = '#000';
        logoWaveContext.save();
        logoWaveContext.scale(logoWaveWidth / logoMaskSize, logoWaveHeight / logoMaskSize);
        logoWaveContext.beginPath();
        logoWaveContext.arc(logoMaskSize / 2, logoMaskSize / 2, logoMaskSize / 2.5, 0, Math.PI * 2);
        logoWaveContext.fill();
        logoWaveContext.restore();
        logoWaveContext.globalCompositeOperation = 'source-over';
      }

      function animateSplash(currentTime) {
        const deltaTime = Math.min((currentTime - previousTime) / 1000, 0.034);
        previousTime = currentTime;
        splashContext.clearRect(0, 0, splashCanvas.width, splashCanvas.height);
        splashContext.lineCap = 'round';
        drawLogoShockwaves(deltaTime);

        for (let index = particles.length - 1; index >= 0; index -= 1) {
          const particle = particles[index];
          particle.age += deltaTime;
          if (particle.age >= particle.lifetime) {
            particles.splice(index, 1);
            continue;
          }
          const drag = Math.pow(particle.drag, deltaTime * 60);
          particle.velocityX *= drag;
          particle.velocityY = particle.velocityY * drag + particle.gravity * deltaTime;
          particle.x += particle.velocityX * deltaTime;
          particle.y += particle.velocityY * deltaTime;

          const speed = Math.hypot(particle.velocityX, particle.velocityY);
          const opacity = 1 - particle.age / particle.lifetime;
          const tailX = particle.x - (particle.velocityX / speed) * particle.length * opacity;
          const tailY = particle.y - (particle.velocityY / speed) * particle.length * opacity;

          splashContext.globalAlpha = opacity;
          splashContext.strokeStyle = particle.color;
          splashContext.fillStyle = particle.color;
          splashContext.lineWidth = particle.width * opacity;
          splashContext.beginPath();
          if (particle.dot) {
            splashContext.arc(particle.x, particle.y, Math.max(1, particle.width * opacity), 0, Math.PI * 2);
            splashContext.fill();
          } else {
            splashContext.moveTo(tailX, tailY);
            splashContext.lineTo(particle.x, particle.y);
            splashContext.stroke();
          }
        }

        splashContext.globalAlpha = 1;
        if (particles.length || logoWaves.length) {
          animationFrame = requestAnimationFrame(animateSplash);
        } else {
          animationFrame = 0;
          splashContext.clearRect(0, 0, splashCanvas.width, splashCanvas.height);
          logoWaveContext.clearRect(0, 0, logoWaveWidth, logoWaveHeight);
        }
      }

      splashTrigger.addEventListener('click', createSplash);
      window.addEventListener('resize', () => {
        resizeSplashCanvas();
        resizeLogoWaveCanvas();
      });
      prepareLogoMask();
      resizeSplashCanvas();
      resizeLogoWaveCanvas();
    </script>
