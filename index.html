    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap');

      :root {
        color-scheme: dark;
        --bg: #0a0c10;
        --surface: #11151c;
        --surface-2: #181e26;
        --border: #252d38;
        --text: #f0f0ff;
        --text-dim: #8b95a7;
        --highlight: #00e5a0;
        --highlight-2: #00b8ff;
        --discord: #5865f2;
        --telegram: #229ed9;
        --github: #e6edf3;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        background: var(--bg);
        background-image:
          radial-gradient(circle at 20% 15%, rgba(0, 229, 160, 0.04) 0%, transparent 40%),
          radial-gradient(circle at 80% 85%, rgba(0, 184, 255, 0.04) 0%, transparent 40%),
          linear-gradient(180deg, #0a0c10 0%, #0d1117 100%);
        color: var(--text);
        font-family: 'Inter', 'Cairo', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        position: relative;
        overflow-x: hidden;
        line-height: 1.6;
        direction: ltr;
      }

      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(37, 45, 56, 0.25) 1px, transparent 1px),
          linear-gradient(90deg, rgba(37, 45, 56, 0.25) 1px, transparent 1px);
        background-size: 42px 42px;
        pointer-events: none;
        z-index: 0;
        mask-image: radial-gradient(ellipse at center, black 25%, transparent 75%);
        -webkit-mask-image: radial-gradient(ellipse at center, black 25%, transparent 75%);
      }

      .stars {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        opacity: 0.5;
      }

      .star {
        position: absolute;
        width: 2px;
        height: 2px;
        background: #fff;
        border-radius: 50%;
        animation: twinkle var(--duration) ease-in-out infinite;
        animation-delay: var(--delay);
      }

      @keyframes twinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }

      .container {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 520px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0;
        transform: translateY(20px);
      }

      @keyframes fadeUp {
        to { opacity: 1; transform: translateY(0); }
      }

      .profile-wrapper {
        position: relative;
        cursor: pointer;
        transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        outline: none;
      }

      .profile-wrapper:hover,
      .profile-wrapper:focus-visible {
        transform: scale(1.05);
      }

      .profile-wrapper:active {
        transform: scale(0.97);
      }

      .profile-ring {
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        background: conic-gradient(from 0deg, var(--highlight), var(--highlight-2), var(--highlight));
        opacity: 0.6;
        animation: spin 8s linear infinite;
        filter: blur(1px);
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .profile-img {
        position: relative;
        z-index: 1;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid var(--border);
        background: var(--surface);
        display: block;
        transition: border-color 0.3s ease;
      }

      .profile-wrapper:hover .profile-img {
        border-color: var(--highlight);
      }

      .name-section {
        text-align: center;
      }

      .name-en {
        font-size: clamp(2rem, 6vw, 2.8rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #ffffff 0%, #c8d6e5 50%, #a0b4c8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.2;
      }

      .name-ar {
        font-size: clamp(1.5rem, 4vw, 2rem);
        font-weight: 700;
        color: var(--highlight);
        margin-top: 4px;
        direction: rtl;
        font-family: 'Cairo', sans-serif;
      }

      .bio {
        color: var(--text-dim);
        font-size: 1rem;
        text-align: center;
        max-width: 360px;
        margin-top: -8px;
      }

      .bio .en {
        display: block;
      }

      .bio .ar {
        display: block;
        direction: rtl;
        font-family: 'Cairo', sans-serif;
        color: var(--highlight);
        opacity: 0.8;
        font-size: 0.9rem;
      }

      .socials {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 8px;
      }

      .social-link {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 20px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
        transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        position: relative;
        overflow: hidden;
      }

      .social-link::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(0, 229, 160, 0.05), rgba(0, 184, 255, 0.05));
        opacity: 0;
        transition: opacity 0.3s;
      }

      .social-link:hover {
        transform: translateY(-3px);
        border-color: var(--highlight);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3), 0 0 20px rgba(0, 229, 160, 0.1);
      }

      .social-link:hover::after {
        opacity: 1;
      }

      .social-link.discord:hover {
        border-color: var(--discord);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3), 0 0 20px rgba(88, 101, 242, 0.2);
      }

      .social-link.telegram:hover {
        border-color: var(--telegram);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3), 0 0 20px rgba(34, 158, 217, 0.2);
      }

      .social-link.github:hover {
        border-color: var(--github);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3), 0 0 20px rgba(230, 237, 243, 0.15);
      }

      .social-link svg {
        width: 22px;
        height: 22px;
        fill: currentColor;
        flex-shrink: 0;
      }

      .social-link span {
        position: relative;
        z-index: 1;
      }

      .email-section {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text-dim);
        font-size: 0.9rem;
        font-weight: 500;
        text-decoration: none;
        transition: color 0.3s;
      }

      .email-section:hover {
        color: var(--highlight);
      }

      .email-section svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }

      footer {
        position: relative;
        z-index: 1;
        margin-top: 10px;
        text-align: center;
        font-size: 0.75rem;
        color: var(--text-dim);
        opacity: 0.6;
        letter-spacing: 0.5px;
      }

      @media (max-width: 480px) {
        .profile-img {
          width: 110px;
          height: 110px;
        }
        .social-link {
          padding: 12px 16px;
          font-size: 0.85rem;
          gap: 8px;
        }
        .social-link svg {
          width: 18px;
          height: 18px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .profile-ring {
          animation: none;
        }
        .container {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>

  <body>

    <script>
      (function generateStars() {
        const starsContainer = document.querySelector('.stars');
        const starCount = 70;
        const fragment = document.createDocumentFragment();

        for (let i = 0; i < starCount; i++) {
          const star = document.createElement('span');
          star.className = 'star';
          star.style.left = Math.random() * 100 + '%';
          star.style.top = Math.random() * 100 + '%';
          star.style.setProperty('--duration', (Math.random() * 3 + 2).toFixed(1) + 's');
          star.style.setProperty('--delay', (Math.random() * 5).toFixed(1) + 's');
          fragment.appendChild(star);
        }

        starsContainer.appendChild(fragment);
      })();

      const profileWrapper = document.querySelector('.profile-wrapper');
      profileWrapper.addEventListener('click', () => {
        const ring = document.querySelector('.profile-ring');
        ring.style.animation = 'none';
        void ring.offsetWidth;
        ring.style.animation = 'spin 1.5s ease-out forwards';
        setTimeout(() => {
          ring.style.animation = 'spin 8s linear infinite';
        }, 1500);
      });
    </script>
